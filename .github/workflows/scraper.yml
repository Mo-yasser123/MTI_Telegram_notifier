name: MTI Telegram Bot

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv tzdata

      - name: Run MTI Notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UNI_USER: ${{ secrets.UNI_USER }}
          UNI_PASS: ${{ secrets.UNI_PASS }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_events.json sent_grades.json sent_reminders.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent notifications state"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c '
          import os, requests
          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("CHAT_ID", "")
          if token and chat_id:
              msg = "<b>[ Bot Error ]</b>\n\nMTI E-Learning Notifier failed on GitHub Actions."
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"},
                  timeout=15,
              )
          '
