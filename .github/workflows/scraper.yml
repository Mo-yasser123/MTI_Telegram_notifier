name: MTI Moodle Telegram Notifier

on:
  schedule:
    - cron: "13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_channel:
        description: "Send to TEST_CHAT_ID without updating state files"
        type: boolean
        default: true
      preview_samples:
        description: "Send sample previews to test channel (forces test_channel)"
        type: boolean
        default: false
      dry_run:
        description: "Print messages to logs without sending to Telegram or saving state"
        type: boolean
        default: false

concurrency:
  group: mti-moodle-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MTI notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          UNI_USER: ${{ secrets.UNI_USER }}
          UNI_PASS: ${{ secrets.UNI_PASS }}
          TEST_CHANNEL: ${{ inputs.test_channel }}
          PREVIEW_SAMPLES: ${{ inputs.preview_samples }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Commit updated notification state
        if: ${{ !inputs.test_channel && !inputs.preview_samples && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_events.json sent_grades.json sent_reminders.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update sent notifications state"
            git push
          fi
