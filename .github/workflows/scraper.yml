name: MTI Telegram Scraper

on:
  schedule:
    - cron: '17 * * * *' # كل ساعة في الدقيقة 17 (أقل زحمة من الدقيقة 0)
  workflow_dispatch: # زر التشغيل اليدوي للطوارئ

# صلاحية الكتابة علشان الـ push يشتغل (حل خطأ 403)
permissions:
  contents: write

# يمنع تشغيل نسختين فوق بعض
concurrency:
  group: mti-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install dependencies
      run: pip install selenium requests python-dotenv

    - name: Run MTI Scraper
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        UNI_USER: ${{ secrets.UNI_USER }}
        UNI_PASS: ${{ secrets.UNI_PASS }}
      run: python main.py

    # always() علشان لو السكربت وقع بعد ما بعت رسايل، الـ IDs تتحفظ برضه
    - name: Commit and push memory (JSON files)
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_events.json sent_grades.json
        # لو مفيش تغيير، مفيش commit ولا push
        git diff --cached --quiet || (git commit -m "Update bot memory" && git push)
