name: MTI Telegram Scraper

on:
  schedule:
    - cron: '0 * * * *' # التشغيل التلقائي كل ساعة
  workflow_dispatch: # زر التشغيل اليدوي للطوارئ

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium requests python-dotenv

    - name: Run MTI Scraper
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        UNI_USER: ${{ secrets.UNI_USER }}
        UNI_PASS: ${{ secrets.UNI_PASS }}
      run: python main.py

    - name: Commit and push memory (JSON files)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_events.json sent_grades.json
        # هذا السطر يمنع حدوث خطأ إذا لم يجد البوت تكليفات جديدة لعمل حفظ لها
        git diff --quiet && git diff --staged --quiet || git commit -m "Update bot memory"
        git push
