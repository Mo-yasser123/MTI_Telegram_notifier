name: MTI Telegram Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mti-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MTI Notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UNI_USER: ${{ secrets.UNI_USER }}
          UNI_PASS: ${{ secrets.UNI_PASS }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in sent_events.json sent_grades.json sent_reminders.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent notifications state"
            git pull --rebase
            git push
          fi
          
