name: MTI Telegram Bot

on:
  workflow_dispatch:
  schedule:
    # شبكة أمان احتياطية كل ساعتين لو cron-job.org وقع مؤقتاً
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: mti-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Run MTI Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UNI_USER: ${{ secrets.UNI_USER }}
          UNI_PASS: ${{ secrets.UNI_PASS }}
        run: python main.py

      - name: Save bot memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f sent_events.json ] || echo "[]" > sent_events.json
          [ -f sent_grades.json ] || echo "[]" > sent_grades.json

          git add sent_events.json sent_grades.json

          if ! git diff --cached --quiet; then
            git commit -m "Update bot memory [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
